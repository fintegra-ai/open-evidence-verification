name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + lint + typecheck (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python and classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy src tests

      - name: Test (pytest)
        run: pytest

  integration:
    # Without OEPT installed, the adapter/conformance tests skip silently and
    # green CI proves nothing about OEVP+OEPT interop. This job installs OEPT
    # and asserts the adapter is importable so the OEPT-dependent tests
    # execute instead of skip.
    name: OEPT integration (adapter + CLI + conformance enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OEVP with dev tools
        run: python -m pip install -e ".[dev]"

      - name: Install OEPT (sibling repository, pinned snapshot)
        # Bump to the latest OEPT tag/release when one is published to PyPI
        # or tagged upstream.
        run: python -m pip install "oept @ git+https://github.com/fintegra-ai/open-evidence-provenance.git@fec8f92ff98c2eaebb5c01ac178459f79c119e9b"

      - name: Assert OEPT adapter is importable (no silent skips)
        run: python -c "from oev.adapters.oept import is_oept_available; assert is_oept_available(), 'OEPT must be importable for this job'"

      - name: Test (pytest, full suite with OEPT present)
        run: pytest -rs

  secrets:
    # Faz A (NLnet plan v2): secret scanning is a boundary rule, not a best
    # effort. The pinned gitleaks binary scans the full git history on every
    # push and every PR; .gitleaks.toml at the repo root carries the (empty
    # by policy) allowlist with justifications.
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b . v8.30.1

      - name: Scan full git history (any finding fails the job)
        run: ./gitleaks detect --source . --report-format json --report-path gitleaks-report.json --redact --exit-code 1
